name: Corpus Refresh

# 매일 KST 01:00 (UTC 16:00) 에 lazyyoyo/naver-blog-importer 로 culcom-
# 네이버 블로그를 조회해, 새로 발행된 글을 samples/naver/ 에 누적한다.
# 끝에서 prune-samples.mjs 가 rolling window (15개) 외 글을 archive/ 로 이동.
#
# 자가 성장 루프: 발행 → cron 흡수 → samples 갱신 → 다음 draft.mjs 가
# 새 샘플 본문을 reference block 으로 주입 (top-3 최근순).
#
# 하남 가드: culcom- 블로그가 다지점 글을 섞어 올릴 가능성에 대비해
# filter-hanam-logNos.mjs 로 "하남" / "미사" 키워드가 들어간 글만 통과시킨다.

on:
  schedule:
    - cron: "0 16 * * *"   # UTC 16:00 = KST 01:00
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corpus-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Restore Gemini OAuth credentials
        env:
          GEMINI_OAUTH_CREDS: ${{ secrets.GEMINI_OAUTH_CREDS }}
        run: |
          mkdir -p ~/.gemini
          printf '%s' "$GEMINI_OAUTH_CREDS" | base64 -d > ~/.gemini/oauth_creds.json
          chmod 600 ~/.gemini/oauth_creds.json
          cat > ~/.gemini/settings.json <<'JSON'
          {
            "security": {
              "auth": {
                "selectedType": "oauth-personal"
              }
            }
          }
          JSON
          cat > ~/.gemini/google_accounts.json <<'JSON'
          {
            "active": "cultisttp@gmail.com",
            "old": []
          }
          JSON

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli@0.41.1

      - name: Clone naver-blog-importer
        run: |
          git clone --depth 1 https://github.com/lazyyoyo/naver-blog-importer.git /tmp/naver-blog-importer

      - name: Install importer Python deps
        working-directory: /tmp/naver-blog-importer/skills/naver-blog-importer
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet -r requirements.txt

      - name: Patch importer fetch.py (strip JSON-invalid \escape)
        # Naver PostTitleListAsync 응답의 pagingHtml 필드는 \' 같은 JSON 비표준
        # escape 를 포함해 json.loads(strict) 가 거부한다 (2026-05-18 cron 실패).
        # _fetch_list_page 의 json.loads 직전에 invalid escape 제거 한 줄 주입.
        # 동일 패턴이 다시 발견되면 README 의 images.py 패치 노트에 합류시킬 것.
        working-directory: /tmp/naver-blog-importer/skills/naver-blog-importer
        run: |
          python3 <<'PY'
          import pathlib
          p = pathlib.Path('scripts/fetch.py')
          src = p.read_text()
          needle = '    return json.loads(text)'
          if needle not in src:
              raise SystemExit('upstream fetch.py shape changed; needle not found')
          patch = (
              '    # culcom: Naver 응답이 \\\' 등 JSON-invalid escape 를 섞어 보내는\n'
              '    # 케이스 대응 — 알려진 유효 escape 외엔 백슬래시를 제거.\n'
              '    text = re.sub(r\'\\\\([^"\\\\/bfnrtu])\', r\'\\1\', text)\n'
              '    return json.loads(text)'
          )
          src = src.replace(needle, patch, 1)
          p.write_text(src)
          print('patched fetch.py')
          PY

      - name: Patch importer images.py (host-별 type 파라미터)
        # images.py 의 _original_url() 은 모든 호스트에서 ?type 을 제거하지만
        # mblogthumb-phinf.pstatic.net 은 type=w800 이 필수 (제거 시 404).
        # 2026-05-19 cron 26074884302 에서 다수 이미지 다운로드 실패 → 본문에
        # `[!](#)` placeholder 잔존 → migrate 가 마커를 못 붙임.
        # 호스트별 분기로 fix.
        working-directory: /tmp/naver-blog-importer/skills/naver-blog-importer
        run: |
          python3 <<'PY'
          import pathlib
          p = pathlib.Path('scripts/images.py')
          src = p.read_text()
          needle = (
              '    # Remove \'type\' query param — Naver uses type=w80, w966, etc.\n'
              '    query = [(k, v) for (k, v) in parse_qsl(parsed.query) if k.lower() != "type"]\n'
              '    return urlunparse(parsed._replace(query=urlencode(query)))'
          )
          if needle not in src:
              raise SystemExit('upstream images.py shape changed; needle not found')
          patch = (
              '    # culcom: host-별 type 파라미터 분기.\n'
              '    # mblogthumb-phinf.pstatic.net 은 type=w800 필수 (제거 시 404).\n'
              '    # 그 외 호스트는 type 제거 (원본 해상도).\n'
              '    host = (parsed.hostname or "").lower()\n'
              '    query = [(k, v) for (k, v) in parse_qsl(parsed.query) if k.lower() != "type"]\n'
              '    if host == "mblogthumb-phinf.pstatic.net":\n'
              '        query.append(("type", "w800"))\n'
              '    return urlunparse(parsed._replace(query=urlencode(query)))'
          )
          src = src.replace(needle, patch, 1)
          p.write_text(src)
          print('patched images.py')
          PY

      - name: Run importer (latest 30)
        id: import
        working-directory: /tmp/naver-blog-importer/skills/naver-blog-importer
        continue-on-error: true
        run: |
          . .venv/bin/activate
          python scripts/import_blog.py culcom- --out /tmp/naver-import --limit 30

      - name: Detect new logNos
        id: detect
        run: |
          if [ ! -d /tmp/naver-import/assets ]; then
            echo "importer assets dir missing — likely import failed or no posts. skipping."
            echo "new=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ALL=$(ls /tmp/naver-import/assets 2>/dev/null | sort -u | tr '\n' ' ')
          echo "importer logNos: ${ALL}"
          NEW=""
          for ln in $ALL; do
            if [ ! -f "flows/blog-draft/prompts/samples/naver/${ln}.md" ]; then
              if [ -z "$NEW" ]; then NEW="$ln"; else NEW="${NEW},${ln}"; fi
            fi
          done
          echo "new logNos: ${NEW}"
          echo "new=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Filter to Hanam posts
        if: steps.detect.outputs.new != ''
        id: filter
        run: |
          FILTERED=$(node flows/blog-draft/scripts/filter-hanam-logNos.mjs \
            --in /tmp/naver-import \
            --logNos "${{ steps.detect.outputs.new }}")
          echo "filtered logNos: ${FILTERED}"
          echo "new=${FILTERED}" >> "$GITHUB_OUTPUT"

      - name: Migrate new posts
        if: steps.filter.outputs.new != ''
        run: |
          node flows/blog-draft/scripts/migrate-from-importer.mjs \
            --in /tmp/naver-import \
            --logNos "${{ steps.filter.outputs.new }}"

      - name: Describe images for new posts
        if: steps.filter.outputs.new != ''
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
        run: |
          node flows/blog-draft/scripts/describe-images.mjs \
            --samples flows/blog-draft/prompts/samples/naver \
            --assets /tmp/naver-import/assets \
            --logNos "${{ steps.filter.outputs.new }}"

      - name: Prune to rolling window
        run: node flows/blog-draft/scripts/prune-samples.mjs --window 15

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flows/blog-draft/prompts/samples/naver
          if git diff --cached --quiet; then
            echo "no corpus changes."
            exit 0
          fi
          NEW="${{ steps.filter.outputs.new }}"
          if [ -n "$NEW" ]; then
            COUNT=$(echo "$NEW" | tr ',' '\n' | wc -l | tr -d ' ')
            MSG="chore(corpus): add ${COUNT} new naver post(s), prune to window 15"
          else
            MSG="chore(corpus): prune to window 15"
          fi
          git commit -m "${MSG}"
          git push origin HEAD:main
